<div class="card">
  <h1>Categoria</h1>

  <p-button (click)="mostrarDialog()" label="Nueva Categoria"></p-button>

  <p-dialog
    header="Categoria"
    [(visible)]="visible"
    [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [style]="{ width: '30vw' }"
    [draggable]="false"
    [resizable]="false"
    class="p-fluid"
  >
    <form [formGroup]="categoriaForm">
      <div class="field">
        <label for="name">Nombre</label>
        <input
          type="text"
          pInputText
          id="name"
          required
          autofocus
          formControlName="nombre"
        />
        <small class="ng-dirty ng-invalid"
          >El campo nombre es obligatorio.
        </small>
      </div>

      <div class="field">
        <label for="det">Detalle</label>
        <input type="text" pInputText id="det" required />
      </div>
    </form>
    <ng-template pTemplate="footer">
      <button
        pButton
        pRipple
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-text"
        (click)="visible = false"
      ></button>
      <button
        pButton
        pRipple
        label="Guardar"
        icon="pi pi-check"
        class="p-button-text"
        (click)="guardarCategoria()"
      ></button>
    </ng-template>
  </p-dialog>

  <p-table
    [value]="categorias"
    [tableStyle]="{ 'min-width': '50rem' }"
    class="mt-4"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>NOMBRE</th>
        <th>DETALLE</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-categoria>
      <tr>
        <td>{{ categoria.id }}</td>
        <td>{{ categoria.nombre }}</td>
        <td>{{ categoria.detalle }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
